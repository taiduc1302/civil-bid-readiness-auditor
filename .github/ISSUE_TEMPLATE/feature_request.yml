name: Feature request
description: Propose a scoped auditor improvement
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Estimating workflow need
      description: What bid-readiness gap or repetitive task should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define done.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Note false-positive/false-negative, compatibility, privacy, or data-quality concerns.
