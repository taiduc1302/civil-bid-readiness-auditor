name: Bug report
description: Report a reproducible bid-readiness problem
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps and sanitized inputs needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Sanitized logs, test output, or screenshots. Never attach real tender/customer/employer data.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result defines the fix?
